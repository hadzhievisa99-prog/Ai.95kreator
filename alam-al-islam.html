<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أعلام الإسلام عبر السنين الهجرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAEDE6; --surface:#F6F8F3; --ink:#1E2621; --muted:#5B675F; --line:#C8CFC4;
  --lapis:#24457A; --gold:#93701F; --sah:#2E7A52; --scrim:rgba(20,28,24,.45);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161E;--surface:#18212C;--ink:#E7E3D6;--muted:#9BA4A9;--line:#2A3542;--lapis:#93B3E8;--gold:#D4B062;--sah:#74C99A;--scrim:rgba(0,0,0,.6);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10161E;--surface:#18212C;--ink:#E7E3D6;--muted:#9BA4A9;--line:#2A3542;--lapis:#93B3E8;--gold:#D4B062;--sah:#74C99A;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-size:16.5px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ar{font-family:"Amiri","Traditional Arabic",serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.hero{padding:26px 16px 6px;text-align:center}
.hero h1{margin:0;font-family:"Amiri",serif;font-weight:700;font-size:clamp(38px,10vw,58px);line-height:1.3;color:var(--gold)}
.hero p{margin:2px 0 0;color:var(--muted);font-size:16px}

/* блок времени — прилипает сверху */
.time{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 12px}
.yrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.yar{font-family:"Amiri",serif;font-weight:700;font-size:clamp(46px,13vw,68px);line-height:1;color:var(--gold)}
.yru{text-align:left;font-size:15px;color:var(--muted)}
.yru b{display:block;font-family:"Amiri",serif;font-size:24px;color:var(--ink);font-weight:700}
.srow{display:flex;align-items:center;gap:8px;margin-top:8px}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:none;background:var(--lapis);color:var(--surface);cursor:pointer;font-size:15px}
.step{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;cursor:pointer;font-size:13px;min-width:38px}
input[type=range]{flex:1;min-width:0;accent-color:var(--gold);height:32px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 96px 0 98px}
@media(max-width:420px){.ticks{padding:0 92px 0 94px}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:inherit;border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--lapis);color:var(--lapis);font-weight:600;box-shadow:inset 0 0 0 1px var(--lapis)}
.chip.s[aria-pressed="true"]{border-color:var(--sah);color:var(--sah);box-shadow:inset 0 0 0 1px var(--sah)}

.event{margin:14px 0 4px;font-size:15px;color:var(--muted)}
.event b{color:var(--gold)}
.count{margin:12px 0 4px;font-size:15px;font-weight:600}
.count span{color:var(--muted);font-weight:400}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:8px;cursor:pointer}
.item:hover{border-color:var(--lapis)}
.item.sah{border-right:4px solid var(--sah)}
.nm,.meta{display:block}
.step{direction:ltr}
.nm{font-family:"Amiri",serif;font-weight:700;font-size:23px;line-height:1.4}
.nar{display:none}
.meta{font-size:14px;color:var(--lapis)}
.age{text-align:center;min-width:56px}
.age b{display:block;font-family:"Amiri",serif;font-size:32px;line-height:1.1;color:var(--gold);font-weight:700}
.age small{font-size:12px;color:var(--muted)}
.age.unk b{font-family:inherit;font-size:13px;line-height:1.4;color:var(--muted);font-weight:500}
.badge{display:inline-block;font-family:"Noto Naskh Arabic",serif;font-size:12.5px;font-weight:600;color:var(--sah);border:1px solid var(--sah);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:3px}
.last{font-size:12.5px;color:var(--muted)}
.empty{padding:30px 0;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);padding:26px 0 40px;border-top:1px solid var(--line);margin-top:26px}

/* карточка */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:86%;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding:8px 0 calc(26px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet .wrap{max-width:600px}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.s-close{float:left;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.s-ar{font-family:"Amiri",serif;font-size:36px;font-weight:700;line-height:1.35;margin:12px 0 0;color:var(--gold)}
.s-name{font-size:15px;font-weight:500;margin:2px 0 0}
.s-then{margin:10px 0 0;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
.s-then b{color:var(--gold)}
.s-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:14px 0 0}
.s-dl dt{color:var(--muted)} .s-dl dd{margin:0}
.s-h{font-size:14px;color:var(--muted);margin:18px 0 6px;font-weight:400}
.books{list-style:none;margin:0;padding:0;direction:rtl;text-align:right}
.books li{font-family:"Amiri",serif;font-size:20px;line-height:1.5;padding:3px 0;border-bottom:1px solid var(--line)}
.s-note{margin:0;font-size:15.5px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<header class="wrap hero">
  <h1>أعلام الإسلام</h1>
  <p>من عاش في السنة الهجرية المختارة، وكم كان عمره حينها</p>
</header>

<div class="time">
  <div class="wrap">
    <div class="yrow">
      <div class="yar" id="yAr"></div>
      <div class="yru"><b id="yRu"></b><span id="yG"></span></div>
    </div>
    <div class="srow">
      <button class="play" id="play" aria-label="تشغيل">▶</button>
      <button class="step" id="m10" aria-label="ناقص عشر سنين">−١٠</button>
      <input type="range" id="yr" min="1" max="1000" step="1" value="200" aria-label="السنة الهجرية">
      <button class="step" id="p10" aria-label="زائد عشر سنين">+١٠</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap">
  <p class="event" id="event"></p>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>
  <p class="foot">الأعمار بالسنين القمرية. ومن لم تُعرف سنة ولادته يظهر قبل وفاته بنحو ستين سنة ولا يُذكر عمره. والبلد هو البلد الذي اشتهر بالإقامة والتعليم فيه. وفي بعض التواريخ خلاف بين المصادر، والمثبت هنا القول المشهور.</p>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-ar"><div class="grip"></div><div class="wrap" id="sb"></div></div>

const EV_AR=[[1,"هجرة النبي ﷺ إلى المدينة"],[2,"غزوة بدر"],[8,"فتح مكة"],[11,"وفاة النبي ﷺ وخلافة أبي بكر"],[13,"خلافة عمر"],[15,"معركتا اليرموك والقادسية"],[21,"معركة نهاوند وفتح مصر"],[23,"خلافة عثمان"],[35,"مقتل عثمان وخلافة علي"],[40,"مقتل علي"],[41,"عام الجماعة وخلافة معاوية"],[64,"خلافة ابن الزبير بمكة"],[73,"مقتل ابن الزبير"],[92,"عبور طارق بن زياد إلى الأندلس"],[132,"سقوط الدولة الأموية وقيام العباسية"],[138,"عبد الرحمن الداخل في قرطبة"],[145,"بناء بغداد"],[218,"بداية المحنة"],[234,"انتهاء المحنة في عهد المتوكل"],[297,"قيام الدولة الفاطمية بإفريقية"],[316,"خلافة قرطبة"],[334,"دخول البويهيين بغداد"],[358,"الفاطميون يأخذون مصر وتُبنى القاهرة"],[422,"نهاية خلافة قرطبة وعصر الطوائف"],[447,"دخول السلاجقة بغداد"],[463,"معركة ملاذكرد"],[478,"سقوط طليطلة"],[479,"معركة الزلاقة"],[492,"الصليبيون يحتلون بيت المقدس"],[567,"صلاح الدين يُنهي الدولة الفاطمية"],[583,"حطين وتحرير بيت المقدس"],[617,"المغول في بلاد ما وراء النهر"],[633,"سقوط قرطبة"],[656,"المغول يدمّرون بغداد"],[658,"معركة عين جالوت"],[690,"سقوط عكا ونهاية الصليبيين"],[699,"قيام الدولة العثمانية"],[804,"معركة أنقرة بين تيمور وبايزيد"],[857,"العثمانيون يفتحون القسطنطينية"],[897,"سقوط غرناطة"],[907,"قيام الدولة الصفوية في إيران"],[922,"معركة مرج دابق"],[923,"العثمانيون في مصر ونهاية المماليك"],[932,"معركة باني بت وقيام الدولة المغولية في الهند"]];


const F={h:"الحديث",f:"الفقه",u:"أصول الفقه",t:"التفسير",q:"القراءات",a:"العقيدة",l:"اللغة",s:"التاريخ",z:"الزهد"};
const MZA={"ханафит":"حنفي","маликит":"مالكي","шафиит":"شافعي","ханбалит":"حنبلي","захирит":"ظاهري"};
const SAH=new Set("abubakr muadh umar ubayy abudharr abudarda ibnmasud salman ubada uthman hudhayfa ali abumusa zayd abuhurayra aisha ummsalama abdallahamr ibnabbas ibnumar abusaid jabir abuumama sahl anas abutufayl".split(" "));
const FEM=new Set(["aisha","ummsalama"]);
const ALL=[...D,...D2];Object.assign(A,A2);
const MZM={};[MZ,MZ2].forEach(o=>Object.entries(o).forEach(([m,ids])=>ids.split(" ").forEach(i=>MZM[i]=m)));
const S=ALL.map(r=>{const a=A[r[0]]||["",""];const n=parseInt((a[0]||"").replace(/[^\d–]/g,"").split("–")[0]);
  return{id:r[0],ar:r[2],d:r[3],f:r[4].split(""),city:r[5].split(",").map(c=>CITY_AR[c.trim()]||c.trim()).join("، "),books:r[6],note:NOTE_AR[r[0]]||"",sah:SAH.has(r[0]),fem:FEM.has(r[0]),mz:MZA[MZM[r[0]]]||"",age:a[0],cause:CAUSE_AR[r[0]]||"",bKnown:!isNaN(n),b:isNaN(n)?r[3]-60:r[3]-n,approx:/≈|–/.test(a[0]||"")}});
const byId={};S.forEach(s=>byId[s.id]=s);
const AD="٠١٢٣٤٥٦٧٨٩";const arNum=n=>String(n).replace(/\d/g,d=>AD[d]);
const ce=ah=>Math.round(ah*0.970229+621.57);
const yrW=n=>n===1?"سنة":n===2?"سنتان":(n>=3&&n<=10)?"سنوات":"سنة";
const yrs=n=>n===1?"سنة واحدة":n===2?"سنتان":`${arNum(n)} ${yrW(n)}`;
const ageAr=a=>arNum(a.replace("≈","نحو ").replace("–","–"))+" سنة";
const st={year:200,field:""};
const match=s=>!st.field||(st.field==="S"?s.sah:s.f.includes(st.field));
function chips(){let h=`<button class="chip" data-f="" aria-pressed="${!st.field}">الكل</button><button class="chip s" data-f="S" aria-pressed="${st.field==="S"}">الصحابة</button>`;
  for(const k in F)h+=`<button class="chip" data-f="${k}" aria-pressed="${st.field===k}">${F[k]}</button>`;
  document.getElementById("chips").innerHTML=h}
function render(){const y=st.year;document.getElementById("yr").value=y;
  document.getElementById("yAr").textContent=arNum(y)+" هـ";
  document.getElementById("yRu").textContent=`سنة ${arNum(y)} هـ`;
  document.getElementById("yG").textContent=`≈ ${arNum(ce(y))} م`;
  let ev=null;for(const e of EV_AR){if(e[0]<=y&&y-e[0]<=40)ev=e}
  document.getElementById("event").innerHTML=ev?`<b>${arNum(ev[0])} هـ:</b> ${ev[1]}`:"";
  const list=S.filter(s=>y>=s.b&&y<=s.d&&match(s)).sort((a,b)=>a.b-b.b);
  document.getElementById("count").innerHTML=list.length?`عاش في سنة ${arNum(y)} هـ: ${arNum(list.length)} <span>(الأكبر سنًّا أولًا)</span>`:"";
  document.getElementById("list").innerHTML=list.length?list.map(s=>{const age=y-s.b;const last=y===s.d;
    return`<li><button class="item${s.sah?" sah":""}" data-id="${s.id}"><span><span class="nm">${s.ar}${s.sah?`<span class="badge">${s.fem?"صحابية":"صحابي"}</span>`:""}</span><span class="meta">${s.f.map(k=>F[k]).join("، ")} · ${s.city.split("، ")[0]}</span>${last?`<span class="last"> · ${s.fem?"تُوفّيت":"تُوفّي"} في هذه السنة</span>`:""}</span>
    <span class="age${s.bKnown?"":" unk"}">${s.bKnown?`<b>${s.approx?"≈":""}${arNum(age)}</b><small>${yrW(age)}</small>`:`<b>العمر<br>غير معروف</b>`}</span></button></li>`}).join("")
    :`<li class="empty">لم يعش أحد من هذه القائمة في هذه السنة. حرّك المؤشر.</li>`;
}
function openSheet(id){const s=byId[id],y=st.year,alive=y>=s.b&&y<=s.d,age=y-s.b;const h=s.fem?"ها":"ه";
  document.getElementById("sb").innerHTML=`<button class="s-close" id="sc">إغلاق</button>
  <p class="s-ar" id="s-ar">${s.ar}${s.sah?` <span class="badge">${s.fem?"صحابية · رضي الله عنها":"صحابي · رضي الله عنه"}</span>`:""}</p>
  ${alive?`<p class="s-then">في سنة <b>${arNum(y)} هـ</b> ${s.bKnown?`كان عمر${h} <b>${s.approx?"نحو ":""}${yrs(age)}</b>`:`كان${s.fem?"ت":""} على قيد الحياة، ولا يُعرف عمر${h} بدقة`}${s.d-y>0?`، وبقي على وفات${h} ${yrs(s.d-y)}`:`، وفي هذه السنة ${s.fem?"تُوفّيت":"تُوفّي"}`}.</p>`:""}
  <dl class="s-dl">
    <dt>الوفاة</dt><dd>سنة ${arNum(s.d)} هـ (≈ ${arNum(ce(s.d))} م)${s.age?`، عن ${ageAr(s.age)}`:""}</dd>
    <dt>البلد</dt><dd>${s.city}</dd>
    ${s.cause?`<dt>خبر الوفاة</dt><dd>${s.cause}</dd>`:""}
    <dt>العلوم</dt><dd>${s.f.map(k=>F[k]).join("، ")}${s.mz?` · ${s.mz}`:""}</dd>
  </dl>
  ${s.books.length?`<h3 class="s-h">أشهر الكتب</h3><ul class="books">${s.books.slice(0,4).map(b=>`<li>${b}</li>`).join("")}</ul>`:""}
  ${s.note?`<h3 class="s-h">بِمَ اشتهر</h3><p class="s-note">${s.note}</p>`:""}`;
  document.getElementById("sheet").scrollTop=0;document.getElementById("sheet").classList.add("open");document.getElementById("scrim").classList.add("open");document.body.style.overflow="hidden";document.getElementById("sc").focus()}
function closeSheet(){document.getElementById("sheet").classList.remove("open");document.getElementById("scrim").classList.remove("open");document.body.style.overflow=""}

function setYear(y){st.year=Math.max(1,Math.min(1000,y));render()}
const slider=document.getElementById("yr");
slider.addEventListener("input",()=>setYear(+slider.value));
document.getElementById("m10").onclick=()=>setYear(st.year-10);
document.getElementById("p10").onclick=()=>setYear(st.year+10);
let timer=null;const play=document.getElementById("play");
function stop(){clearInterval(timer);timer=null;play.textContent="▶";play.setAttribute("aria-label","تشغيل")}
play.onclick=()=>{if(timer){stop();return}if(st.year>=1000)st.year=1;play.textContent="❚❚";play.setAttribute("aria-label","إيقاف");timer=setInterval(()=>{if(st.year>=1000){stop();return}setYear(st.year+1)},120)};
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");if(f){st.field=f.dataset.f;chips();render();return}
  if(e.target.id==="sc"||e.target.id==="scrim"){closeSheet();return}
  const it=e.target.closest("[data-id]");if(it){stop();openSheet(it.dataset.id)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
chips();render();
</script>
